<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cartagena en AR</title>
  <meta name="description" content="Monumentos y personajes de Cartagena en 3D. Míralos en tu espacio con realidad aumentada, sin descargar nada.">
  <meta name="theme-color" content="#070B12">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/estilos.css">
  <!-- El motor de metamorfosis (assets/metamorfosis/) importa 'three': se resuelve aquí, sin compilar. -->
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.min.js" } }</script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body class="vitrina">
  <header class="barra">
    <a class="marca" href="./">Cartagena <em>en AR</em></a>
    <div class="barra__acciones">
      <div class="idiomas" id="idiomas" role="group" aria-label="Idioma de la historia" hidden></div>
      <a class="enlace solo-escritorio" href="qr.html">Códigos QR</a>
    </div>
  </header>

  <main class="escena">
    <div class="escenario">
      <div class="foco" aria-hidden="true"></div>
      <!-- El QR escondido en el modelo: sus cubos se dibujan aquí, encima del visor (assets/metamorfosis/). -->
      <canvas class="lienzo-qr" id="lienzoQr" aria-hidden="true"></canvas>
      <!-- Android: AR dentro de la página (WebXR). iPhone/iPad: Quick Look con assets/quicklook.js. -->
      <model-viewer id="mv" camera-controls disable-pan disable-zoom touch-action="pan-y"
        interaction-prompt="none" auto-rotate auto-rotate-delay="2500" rotation-per-second="14deg"
        autoplay ar ar-modes="webxr" ar-placement="floor" ar-scale="auto"
        shadow-intensity="1.1" shadow-softness="0.9" exposure="1" environment-image="neutral"
        loading="eager" alt="">
        <span slot="ar-button" hidden></span>
        <span slot="progress-bar" hidden></span>
        <!-- Solo se ven durante la AR en Android (WebXR) -->
        <div class="ar-ayuda" id="arAyuda">Apunta al piso y toca para colocarlo</div>
        <div class="ar-controles" id="arControles">
          <button class="pildora" id="arHistoria" type="button">■ Detener historia</button>
          <button class="pildora" id="arMusica" type="button" aria-pressed="false" hidden>♪ Música</button>
        </div>
      </model-viewer>
      <div class="cargando" id="cargando" aria-hidden="true"><i id="cargandoBarra"></i></div>
      <p class="leyenda-qr etiqueta" id="leyendaQr" aria-live="polite"></p>
    </div>

    <section class="ficha" aria-live="polite">
      <span class="etiqueta"><span class="contador" id="contador"></span> · <span id="grupo"></span></span>
      <h1 class="nombre" id="nombre"><span></span></h1>
      <p class="variante" id="variante"></p>
      <div class="acciones">
        <button class="btn btn--coral" id="btnAr" type="button">
          <span class="btn__tinta" aria-hidden="true"></span>
          <span id="btnArTexto">Ver en tu espacio</span>
          <svg class="anillo" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="8" class="anillo__fondo"/>
            <circle cx="10" cy="10" r="8" class="anillo__avance" id="anillo" pathLength="1"/>
          </svg>
        </button>
        <button class="btn btn--sutil" id="btnHistoria" type="button" hidden>
          <span class="btn__tinta" aria-hidden="true"></span>
          <span id="btnHistoriaTexto">▶ Historia</span>
        </button>
        <button class="btn btn--sutil btn--icono" id="btnMusica" type="button" aria-pressed="false" aria-label="Música" hidden>
          <span class="btn__tinta" aria-hidden="true"></span>♪
        </button>
        <button class="btn btn--sutil btn--icono" id="btnQr" type="button" aria-pressed="false" aria-label="Ver el código QR de este modelo">
          <span class="btn__tinta" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="14.5" y="3.5" width="6" height="6" rx="1"/><rect x="3.5" y="14.5" width="6" height="6" rx="1"/><path d="M14.5 14.5h2.5v2.5h-2.5zM20.5 14.5v.01M14.5 20.5h.01M17.5 20.5h3v-3"/></svg>
        </button>
      </div>
      <p class="aviso" id="aviso" hidden></p>
      <a class="enlace" id="enlaceComparar" href="comparar.html" hidden>Comparar las dos versiones →</a>
    </section>

    <nav class="tira" aria-label="Modelos">
      <button class="flecha" id="anterior" type="button" aria-label="Modelo anterior">‹</button>
      <div class="miniaturas" id="miniaturas"></div>
      <button class="flecha" id="siguiente" type="button" aria-label="Modelo siguiente">›</button>
    </nav>

  </main>

  <!-- Al llegar por un QR: la AR del modelo se abre sola; si el teléfono pide un toque, basta tocar aquí. -->
  <div class="arranque" id="arranque" role="dialog" aria-modal="true" aria-labelledby="arranqueNombre" hidden>
    <img class="arranque__poster" id="arranquePoster" alt="">
    <div class="arranque__pie">
      <span class="etiqueta">Cartagena en AR</span>
      <h2 class="arranque__nombre" id="arranqueNombre"></h2>
      <button class="btn btn--coral arranque__btn" id="arranqueBtn" type="button">
        <span class="btn__tinta" aria-hidden="true"></span>
        <span id="arranqueTexto">Toca para verlo en tu espacio</span>
      </button>
      <button class="enlace arranque__salir" id="arranqueSalir" type="button">Ver la página</button>
    </div>
  </div>

  <script type="module" src="assets/vitrina.js"></script>
</body>
</html>
