<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Códigos QR · Cartagena en AR</title>
  <meta name="description" content="Hoja imprimible con un código QR por modelo">
  <meta name="theme-color" content="#070B12">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body class="hoja-qr">
  <header class="barra no-imprimir">
    <a class="volver" href="index.html">← Vitrina</a>
    <button class="btn btn--sutil" type="button" onclick="print()" style="min-height:38px;font-size:14px">Imprimir</button>
  </header>
  <div class="contenedor">
    <div class="cabecera">
      <span class="etiqueta no-imprimir">Cartagena en AR</span>
      <h1>Códigos <em>QR</em></h1>
    </div>

    <div class="no-imprimir">
      <div class="alerta" id="alertaLocal" hidden>
        Estás en una dirección local. Escribe la dirección pública del sitio para que los códigos funcionen en cualquier celular.
      </div>
      <form class="base-url" id="formBase">
        <input id="base" type="url" placeholder="https://tu-dominio/ruta/" aria-label="Dirección pública del sitio" required>
        <button class="btn btn--coral" type="submit" style="min-height:44px;font-size:14.5px">Actualizar códigos</button>
      </form>
    </div>

    <div class="hoja" id="hoja"></div>
  </div>

  <script type="module">
    import { MODELOS } from './assets/modelos.js';
    import { qrSvg, descargarQrPng, esDireccionLocal } from './assets/qr.js';

    const $ = (id) => document.getElementById(id);
    const guardada = new URLSearchParams(location.search).get('base');
    $('base').value = guardada || new URL('.', location.href).href;
    $('alertaLocal').hidden = !(esDireccionLocal() && !guardada);

    // Los códigos usan ver.html?m=<id>: así coinciden con los que ya están impresos.
    const entradas = [
      ...MODELOS.map((m) => ({ titulo: m.nombre, sub: m.variante, pagina: `ver.html?m=${m.id}`, archivo: `qr-${m.id}.png` })),
      { titulo: 'India Catalina', sub: 'Las dos versiones', pagina: 'comparar.html', archivo: 'qr-comparar-india.png' },
      { titulo: 'Todos los modelos', sub: 'Vitrina', pagina: 'index.html', archivo: 'qr-vitrina.png' },
    ];

    function pintar() {
      const base = $('base').value.endsWith('/') ? $('base').value : `${$('base').value}/`;
      $('hoja').innerHTML = '';
      for (const e of entradas) {
        const url = new URL(e.pagina, base).href;
        const div = document.createElement('div');
        div.className = 'codigo';
        div.innerHTML = `<div class="qr">${qrSvg(url, e.titulo)}</div><h3>${e.titulo}</h3><small>${e.sub}</small><div class="url">${url}</div>`;
        const b = document.createElement('button');
        b.className = 'btn btn--sutil';
        b.type = 'button';
        b.textContent = 'Descargar PNG';
        b.addEventListener('click', () => descargarQrPng(url, e.archivo));
        div.append(b);
        $('hoja').append(div);
      }
    }
    $('formBase').addEventListener('submit', (ev) => {
      ev.preventDefault();
      history.replaceState(null, '', `?base=${encodeURIComponent($('base').value)}`);
      $('alertaLocal').hidden = true;
      pintar();
    });
    pintar();
  </script>
</body>
</html>
